<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="70%">
      <stop offset="0" stop-color="#3a1a12"/>
      <stop offset="0.55" stop-color="#140a0c"/>
      <stop offset="1" stop-color="#070507"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="62%" r="38%">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#f5b84d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f5b84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="velvetL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c0610"/>
      <stop offset="0.12" stop-color="#c41a2c"/>
      <stop offset="0.22" stop-color="#6e0814"/>
      <stop offset="0.34" stop-color="#d42536"/>
      <stop offset="0.46" stop-color="#78091a"/>
      <stop offset="0.6" stop-color="#e0303f"/>
      <stop offset="0.74" stop-color="#860c1d"/>
      <stop offset="0.88" stop-color="#ea3a48"/>
      <stop offset="1" stop-color="#9a1022"/>
    </linearGradient>
    <linearGradient id="velvetR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5c0610"/>
      <stop offset="0.12" stop-color="#c41a2c"/>
      <stop offset="0.22" stop-color="#6e0814"/>
      <stop offset="0.34" stop-color="#d42536"/>
      <stop offset="0.46" stop-color="#78091a"/>
      <stop offset="0.6" stop-color="#e0303f"/>
      <stop offset="0.74" stop-color="#860c1d"/>
      <stop offset="0.88" stop-color="#ea3a48"/>
      <stop offset="1" stop-color="#9a1022"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.5" stop-color="#f2b545"/>
      <stop offset="1" stop-color="#b9781c"/>
    </linearGradient>
    <linearGradient id="valance" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a040c"/>
      <stop offset="1" stop-color="#a51426"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- luce di scena -->
  <ellipse cx="512" cy="640" rx="400" ry="420" fill="url(#spot)"/>
  <ellipse cx="512" cy="880" rx="300" ry="50" fill="#ffd27a" opacity="0.28" filter="url(#soft)"/>

  <!-- triangolo play al centro della luce -->
  <path d="M452 520 L452 760 L640 640 Z" fill="url(#gold)" stroke="#fff3cf" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- sipario sinistro, raccolto verso l'esterno -->
  <path d="M0 120 L430 120 C 400 330, 330 520, 250 640 C 205 705, 190 760, 196 800 C 150 860, 80 940, 0 1024 Z"
        fill="url(#velvetL)"/>
  <path d="M0 120 L430 120 C 400 330, 330 520, 250 640 C 205 705, 190 760, 196 800 C 150 860, 80 940, 0 1024 Z"
        fill="url(#shade)"/>
  <!-- sipario destro -->
  <path d="M1024 120 L594 120 C 624 330, 694 520, 774 640 C 819 705, 834 760, 828 800 C 874 860, 944 940, 1024 1024 Z"
        fill="url(#velvetR)"/>
  <path d="M1024 120 L594 120 C 624 330, 694 520, 774 640 C 819 705, 834 760, 828 800 C 874 860, 944 940, 1024 1024 Z"
        fill="url(#shade)"/>

  <!-- cordoni dorati -->
  <path d="M150 700 C 200 690, 245 700, 270 720" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="276" cy="728" r="20" fill="url(#gold)"/>
  <path d="M874 700 C 824 690, 779 700, 754 720" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="748" cy="728" r="20" fill="url(#gold)"/>

  <!-- mantovana in alto con frange -->
  <path d="M0 0 H1024 V150 C 940 205, 860 205, 768 160 C 680 210, 600 210, 512 165 C 424 210, 344 210, 256 160 C 164 205, 84 205, 0 150 Z"
        fill="url(#valance)"/>
  <path d="M0 150 C 84 205, 164 205, 256 160 C 344 210, 424 210, 512 165 C 600 210, 680 210, 768 160 C 860 205, 940 205, 1024 150"
        fill="none" stroke="url(#gold)" stroke-width="14"/>
</svg>
